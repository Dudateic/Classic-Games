name: Classic Games

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install pygame numpy

      - name: Verify project structure
        run: |
          echo "Checking folders..."
          ls -R

      - name: Check Breakout entrypoint
        run: test -f Breakout/main.py

      - name: Syntax check Breakout
        run: python -m py_compile Breakout/main.py

      - name: Basic Python sanity test
        run: python -c "print('CI OK - Classic Games running')"
